<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cervo Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="capture-shell">
      <section class="capture-panel" aria-label="Capture draft">
        <textarea
          id="capture-text"
          class="capture-area"
          aria-label="Capture"
          placeholder="Capture..."
          spellcheck="true"
        ></textarea>
        <div id="image-preview-list" class="image-preview-list" aria-label="Image attachments"></div>
      </section>
      <footer class="capture-footer">
        <p id="capture-status" class="capture-status" role="status" aria-live="polite"></p>
        <div class="capture-actions">
          <input
            id="image-file-input"
            class="image-file-input"
            type="file"
            accept="image/png,image/jpeg,image/gif,image/webp"
            multiple
          />
          <button
            id="image-file-button"
            class="secondary-button icon-button"
            type="button"
            title="Add images"
            aria-label="Add images"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M16 5h6" />
              <path d="M19 2v6" />
              <path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5" />
              <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21" />
              <circle cx="9" cy="9" r="2" />
            </svg>
          </button>
          <button id="open-cervo-button" class="secondary-button" type="button">Open Cervo</button>
          <button id="append-button" class="append-button" type="button" disabled>Append</button>
        </div>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
