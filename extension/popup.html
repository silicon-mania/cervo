<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cervo Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="capture-shell">
      <textarea
        id="capture-text"
        class="capture-area"
        aria-label="Capture"
        placeholder="Capture..."
        spellcheck="true"
      ></textarea>
      <footer class="capture-footer">
        <p id="capture-status" class="capture-status" role="status" aria-live="polite"></p>
        <button id="append-button" class="append-button" type="button" disabled>Append</button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
